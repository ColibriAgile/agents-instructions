# Requisitos declarados de execução; não são detecção de ferramentas nem garantia de compatibilidade.
# Cobertura inicial: somente as skills abaixo foram catalogadas. Ausência de entrada significa desconhecido.
# PowerShell 7 é o runtime de referência adotado para fluxos pwsh; não foi auditada a versão mínima dos scripts.
version: 1
skills:
  # SKILLS/delphi-xe2-build/SKILL.md, Passo 2; scripts/Invoke-XE2Build.ps1.
  delphi-xe2-build:
    platforms: [win32]
    tools: [Delphi XE2]
    notes:
      - Também requer MSBuild .NET Framework 4, cmd.exe, bibliotecas XE2 e a configuração SISTEMA_COLIBRI.
      - Os caminhos de RAD Studio e bibliotecas precisam corresponder à instalação local.
  # SKILLS/assign-bundles/SKILL.md: usa a CLI colibri-skills (bin/colibri-skills.mjs) da raiz do clone.
  assign-bundles:
    tools: [Node.js]
    notes:
      - Execute no clone de agents-instructions, depois de npm ci e npm run build.
  # SKILLS/colibri-cis-testes/SKILL.md e scripts/Invoke-CisSnapshot.ps1.
  colibri-cis-testes:
    platforms: [win32]
    tools: [PowerShell 7, sqlcmd, SQL Server, ambiente local Colibri CIS]
    notes:
      - Requer executáveis, serviços, configuração local do CIS e permissões de acesso ao banco de testes.
      - PowerShell 7 é o runtime de referência para pwsh; a versão mínima não foi auditada.
  # SKILLS/deep-review/SKILL.md; ferramentas extras são condicionais às opções utilizadas.
  deep-review:
    tools: [Python 3, Git]
    notes:
      - Os exemplos usam PowerShell; para os scripts Python, use py -3 no Windows ou python3 em macOS/Linux.
      - Revisão de PR exige gh autenticado; runtimes não nativos exigem compozy e suas configurações.
  # SKILLS/colibri-campos-release/SKILL.md, seção Constantes. Lê os IDs dos campos em SKILLS/colibri-notas-release/SKILL.md e SKILLS/colibri-refinar-tarefa/SKILL.md.
  colibri-campos-release:
    tools: [MCP Atlassian]
    notes:
      - O MCP do Atlassian precisa de permissão de escrita no Jira para gravar os campos Release title e Release notes.
  # SKILLS/colibri-refinar-tarefa/SKILL.md, seção Constantes.
  colibri-refinar-tarefa:
    tools: [MCP Atlassian]
    notes:
      - O MCP do Atlassian precisa de permissão de escrita no Jira para gravar o campo Refinement.
  # SKILLS/colibri-para-teste/SKILL.md, passos 1 a 7. Lê os IDs dos campos em SKILLS/colibri-notas-release/SKILL.md e SKILLS/colibri-refinar-tarefa/SKILL.md.
  colibri-para-teste:
    tools: [Git, GitHub CLI, MCP Atlassian]
    notes:
      - O gh precisa estar autenticado com permissão para disparar workflows e ler artefatos do repositório.
      - O MCP do Atlassian precisa do conector v2 (discover e execute*), com permissão de escrita no Jira.
  # SKILLS/colibri-notas-release/SKILL.md, seção Ferramentas.
  colibri-notas-release:
    tools: [MCP Atlassian, MCP Slack]
    notes:
      - O MCP do Atlassian precisa do conector v2 (discover e execute*), com acesso de escrita ao Confluence.
      - O MCP do Slack precisa estar autenticado no workspace Sistema Colibri e permitir envio de arquivo; sem ele, a skill publica só no Confluence. O envio usa curl.
