# bundles.yaml
# Catálogo central de bundles de skills, agrupados por stack e por temática.
# Cada bundle lista skills que vivem em SKILLS/ neste mesmo repositório.
# "core" é obrigatório em todo projeto; os demais são compostos pelo projeto
# (stack + temáticas) ou instalados pontualmente (ex: authoring).

repo: ColibriAgile/agents-instructions

bundles:
  core:
    description: Obrigatório em todo projeto — workflow genérico, independente de stack.
    skills:
      - commit
      - repository-cli-efficiency
      - caveman      
      - grillme
      - no-workarounds

  dotnet:
    description: Projetos .NET / Colibri.
    skills:
      - atualizar-pacotes-nuget
      - atualizar-testes-mtp
      - colibri-connection-string
      - colibri-logging
      - csharp-string-optimization
      - csharp-tests
      - dotnet-efficient-validation
      - http-client-resilience
      - pgsql-test-runner
      - extrair-requisitos-csharp
      - colibri-ports

  delphi:
    description: Projetos Delphi legados.
    skills:
      - extrair-requisitos-delphi

  frontend:
    description: Interfaces web / UI.
    skills:
      - frontend-design

  sdd:
    description: Fluxo SDD completo — PRD -> TechSpec -> Tasks -> execução -> code review.
    skills:
      - sdd-prd
      - sdd-techspec
      - sdd-tasks
      - sdd-orquestrar
      - sdd-refactor
      - sdd-review
      - sdd-codereview-execute
      - sdd-codereview-plan

  code-review:
    description: Revisão de código e execução das correções apontadas.
    skills:
      - deep-review

  jira-pm:
    description: Gestão de tarefas no Jira e migração de tarefas do ClickUp.
    skills:
      - jira-aashari-mcp
      - jira-mcp-issue-management
      - jira-task-refinement
      - jira-issue-description-generator
      - clickup-to-jira-task-conversion

  authoring:
    description: Autoria de skills/agents/rules/hooks — instalação pontual (ad hoc), remover ao final da tarefa.
    skills:
      - create-agent
      - create-hook
      - create-instructions
      - create-prompt
      - create-skill
      - agent-customization
      - writing-agents-md
      - ai-ready-score
      - ai-ready-fix
      - writing-skills
      - to-prompt
      - bundle-orphan-skills
